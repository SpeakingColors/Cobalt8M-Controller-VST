name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cobalt8m-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh tests/run.sh
  plugin:
    needs: core-tests
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libgl-dev xvfb
      - run: git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git third_party/JUCE
      - shell: bash
        run: |
          set -o pipefail
          (cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release --parallel 4) 2>&1 | tee build.log
      - name: Editor self test (Linux, offscreen)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target Cobalt8MSnap --parallel 4
          xvfb-run -a build/Cobalt8MSnap_artefacts/Release/Cobalt8MSnap --selftest
      - if: failure()
        shell: bash
        run: grep -E "error|Error" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-${{ runner.os }}
          path: |
            build/*_artefacts/**/VST3/**
            build/*_artefacts/**/Standalone/**
